# Запуск на своём сервере: бот + Caddy (сам выпускает HTTPS-сертификат для DOMAIN)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: 3000
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to app:3000
    volumes:
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data:
