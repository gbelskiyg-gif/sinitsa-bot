# Запуск на своём сервере: бот + Caddy (сам выпускает HTTPS-сертификаты, настройки — Caddyfile)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: 3000
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # куда ещё могут зайти (www, старый адрес) — всё перенаправляется на DOMAIN
      REDIRECT_FROM: ${REDIRECT_FROM:-www.${DOMAIN}}
      # прежний адрес сайта — продолжает работать для старых кнопок в Telegram
      OLD_DOMAIN: ${OLD_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data:
